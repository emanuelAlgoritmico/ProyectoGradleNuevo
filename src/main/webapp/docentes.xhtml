<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Facelets Hello Greeting</title>
    </h:head>

    <h:body>

        <h:form>

            <p:card style="width: 35rem; margin-bottom: 2em">
                <f:facet name="title">Gestionar Docentes</f:facet>

                <h:panelGrid columns="3">

                    <p:outputLabel for="txfCodigo" value="Código : " />
                    <p:inputText id="txfCodigo"/>
                    <p:message for="txfCodigo"/>

                    <p:outputLabel for="txfNombre" value="Nombre : " />
                    <p:inputText id="txfNombre"/>
                    <p:message for="txfNombre"/>

                    <p:outputLabel for="txfApellido" value="Apellido : " />
                    <p:inputNumber id="txfApellido"/>
                    <p:message for="txfApellido"/>

                    <p:outputLabel for="txfGenero" value="Genero : " />
                    <p:inputNumber id="txfGenero"/>
                    <p:message for="txfGenero"/>

                </h:panelGrid>

            </p:card>

        </h:form>

    </h:body>
</html>
